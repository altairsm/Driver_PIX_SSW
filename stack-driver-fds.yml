version: '3.8'

networks:
  sactudonet:
    external: true

services:
  frontend:
    image: altairsm/driver-pix-ssw-frontend:latest
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.docker.network=sactudonet
        - traefik.http.routers.driverfds.rule=Host(`driverfds.intuitiva.log.br`)
        - traefik.http.routers.driverfds.entrypoints=websecure
        - traefik.http.routers.driverfds.tls.certresolver=letsencryptresolver
        - traefik.http.services.driverfds.loadbalancer.server.port=80
        - traefik.http.middlewares.driverfds-buffering.buffering.maxRequestBodyBytes=209715200
        - traefik.http.routers.driverfds.middlewares=driverfds-buffering
    networks:
      - sactudonet

  ssw-backend:
    image: altairsm/driver-pix-ssw-backend:latest
    environment:
      DB_HOST: postgres_postgres
      DB_PORT: 5432
      DB_NAME: driverfds
      DB_USER: escala_admin
      DB_PASSWORD: f18f8dd7ad0683fb97c91eb4852ff645
      GOOGLE_MAPS_API_KEY: AIzaSyArrv1bWt3ye29tPLyDkj38qc6P70jCctM
      JWT_SECRET: 0e560c48d422acdbf0b106df4dc154c5
      EXTERNAL_API_KEY: 9Lx7qR2mK4vNw8sT5bYcUzE1fH3JdPa
      PORT: 3001
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sactudonet