services:
  postgres:
    image: postgres:16-alpine
    container_name: driver-pey-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: driverfds
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PUhgB0AZWAfhfm9qFe0sDcLzQG09hTGLkSC3eOa66e333b7b
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        COMMIT_HASH: ${COMMIT_HASH:-unknown}
        VERSION: ${VERSION:-v3.4.0}
    container_name: driver-pey-backend
    ports:
      - "3001:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: driverfds
      DB_USER: postgres
      DB_PASS: PUhgB0AZWAfhfm9qFe0sDcLzQG09hTGLkSC3eOa66e333b7b
      JWT_SECRET: 0e560c48d422acdbf0b106df4dc154c5
      GOOGLE_MAPS_API_KEY: AIzaSyArrv1bWt3ye29tPLyDkj38qc6P70jCctM
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: driver-pey-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
